name: Build and Push Docker Images

# Publishes the two images docker-compose.yaml uses:
#   ghcr.io/<owner>/<repo>          Dockerfile target "runner"  (the app)
#   ghcr.io/<owner>/<repo>-schema   Dockerfile target "schema" (prisma db push)
#
# Release tags (v1.2.3) push :1.2.3, :1.2, :latest and :sha-<short>.
# Pull requests build the app image only (no push) to catch build breaks.
# Manual runs push :sha-<short> and :<branch>; arm64 is opt-in (slow under QEMU).

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      arm64:
        description: "Also build linux/arm64 (slow, emulated)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # build provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runner
            suffix: ""
          - target: schema
            suffix: "-schema"
    steps:
      - name: Skip schema image on pull requests
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ matrix.target }}" == "schema" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Image name (lowercase)
        if: steps.gate.outputs.skip != 'true'
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags and OCI labels)
        if: steps.gate.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=pr

      - name: Set up QEMU
        if: steps.gate.outputs.skip != 'true' && inputs.arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: steps.gate.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }}
        if: steps.gate.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ inputs.arm64 && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Separate cache per target so the two images don't evict each other.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Attest build provenance
        if: steps.gate.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
