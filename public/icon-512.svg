<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0ea5e9" stroke="#0284c7" stroke-width="8"/>
  
  <!-- House structure -->
  <path d="M160 350 L160 250 L352 250 L352 350 Z" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  
  <!-- Roof -->
  <path d="M140 250 L256 170 L372 250 L352 250 L256 190 L160 250 Z" fill="#f97316" stroke="#ea580c" stroke-width="3"/>
  
  <!-- Door -->
  <rect x="230" y="290" width="52" height="60" fill="#0284c7" stroke="#0369a1" stroke-width="2" rx="4"/>
  
  <!-- Door handle -->
  <circle cx="270" cy="320" r="3" fill="#ffffff"/>
  
  <!-- Windows -->
  <rect x="180" y="270" width="30" height="30" fill="#0ea5e9" stroke="#0284c7" stroke-width="2" rx="3"/>
  <rect x="302" y="270" width="30" height="30" fill="#0ea5e9" stroke="#0284c7" stroke-width="2" rx="3"/>
  
  <!-- Window frames -->
  <line x1="195" y1="270" x2="195" y2="300" stroke="#ffffff" stroke-width="1"/>
  <line x1="180" y1="285" x2="210" y2="285" stroke="#ffffff" stroke-width="1"/>
  <line x1="317" y1="270" x2="317" y2="300" stroke="#ffffff" stroke-width="1"/>
  <line x1="302" y1="285" x2="332" y2="285" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Chimney -->
  <rect x="300" y="180" width="20" height="40" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  
  <!-- Hub symbol (interconnected dots) -->
  <g transform="translate(256, 380)">
    <!-- Central hub -->
    <circle cx="0" cy="0" r="8" fill="#f97316"/>
    
    <!-- Connected nodes -->
    <circle cx="-25" cy="-15" r="5" fill="#0ea5e9"/>
    <circle cx="25" cy="-15" r="5" fill="#0ea5e9"/>
    <circle cx="-25" cy="15" r="5" fill="#0ea5e9"/>
    <circle cx="25" cy="15" r="5" fill="#0ea5e9"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="-25" y2="-15" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="0" x2="25" y2="-15" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="0" x2="-25" y2="15" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="0" x2="25" y2="15" stroke="#0284c7" stroke-width="2"/>
  </g>
</svg>
