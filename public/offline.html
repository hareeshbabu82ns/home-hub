<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9f2f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13201d" media="(prefers-color-scheme: dark)" />
    <title>Offline · HomeHub</title>
    <style>
      :root { --bg: #e9f2f0; --fg: #161c1b; --muted: #5e6b68; --primary: #47857a; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #13201d; --fg: #e3ebe9; --muted: #9aa8a5; --primary: #6fb3a6; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: var(--bg); color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.25rem; margin: 16px 0 4px; }
      p { color: var(--muted); margin: 0 0 24px; max-width: 32ch; }
      button {
        appearance: none; border: 0; border-radius: 10px; padding: 12px 20px; min-height: 44px;
        background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Home Hub can't reach its server. Check your Wi-Fi or VPN and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
